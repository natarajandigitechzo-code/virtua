<svg width="250" height="65" viewBox="0 0 250 65" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap');
      .logo-top { font-family: 'Poppins', sans-serif; font-weight: 600; fill: #F5A623; font-size: 29px; letter-spacing: -0.5px; }
      .logo-bot { font-family: 'Poppins', sans-serif; font-weight: 400; fill: #FFFFFF; font-size: 23px; letter-spacing: -0.3px; }
    </style>
  </defs>

  <!-- Icon Geometry (Separated Ticks - No Merging) -->
  <g transform="translate(4, 3) scale(0.58)">
    <!-- Top White Circle Arc -->
    <path d="M 23 75 A 38 38 0 1 1 76 22" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <!-- Bottom White Circle Arc -->
    <path d="M 78 28 A 38 38 0 0 1 25 80" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    
    <!-- Top Orange Checkmark (Separated, No Merge) -->
    <path d="M 31 40 L 46 47 L 75 16" stroke="#F5A623" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Orange Checkmark (Separated, No Merge) -->
    <path d="M 69 60 L 54 53 L 25 84" stroke="#F5A623" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Text -->
  <g transform="translate(74, 5)">
    <text x="0" y="24" class="logo-top">Virtua</text>
    <text x="0" y="48" class="logo-bot">technologies</text>
  </g>
</svg>
